<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- White Facet Gradient -->
    <linearGradient id="wolfWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#cyanGlow)">
    <!-- Top Left Ear -->
    <polygon points="25,12 45,26 38,48 20,32" fill="url(#wolfWhite)" stroke="#00F0FF" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Top Right Ear -->
    <polygon points="95,12 75,26 82,48 100,32" fill="url(#wolfWhite)" stroke="#00F0FF" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Forehead Center Diamond -->
    <polygon points="60,14 74,28 60,40 46,28" fill="url(#wolfWhite)" stroke="#00F0FF" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Brow Left -->
    <polygon points="45,29 59,41 42,58 26,49" fill="url(#wolfWhite)" stroke="#00F0FF" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Brow Right -->
    <polygon points="75,29 61,41 78,58 94,49" fill="url(#wolfWhite)" stroke="#00F0FF" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Cheek Left -->
    <polygon points="26,51 41,59 34,80 20,68" fill="url(#wolfWhite)" stroke="#00F0FF" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Cheek Right -->
    <polygon points="94,51 79,59 86,80 100,68" fill="url(#wolfWhite)" stroke="#00F0FF" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Center Nose Bridge -->
    <polygon points="60,42 72,56 60,82 48,56" fill="url(#wolfWhite)" stroke="#00F0FF" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Lower Muzzle Left -->
    <polygon points="47,60 59,82 46,102 33,85" fill="url(#wolfWhite)" stroke="#00F0FF" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Lower Muzzle Right -->
    <polygon points="73,60 61,82 74,102 87,85" fill="url(#wolfWhite)" stroke="#00F0FF" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Chin Tip -->
    <polygon points="60,83 70,103 60,112 50,103" fill="url(#wolfWhite)" stroke="#00F0FF" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Glowing Cyan Eye Left -->
    <polygon points="42,49 56,53 45,57 37,51" fill="#00F0FF" stroke="#00F0FF" stroke-width="1.5" />
    <polygon points="44,50 53,53 46,55 40,51" fill="#030712" />

    <!-- Glowing Cyan Eye Right -->
    <polygon points="78,49 64,53 75,57 83,51" fill="#00F0FF" stroke="#00F0FF" stroke-width="1.5" />
    <polygon points="76,50 67,53 74,55 80,51" fill="#030712" />
  </g>
</svg>